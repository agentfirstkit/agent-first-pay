[package]
name = "agent-first-pay"
version = "0.9.0"
edition = "2024"
description = "A payment tool for AI agents — send and receive across five networks through one interface, with spending limits you control."
license = "MIT"
repository = "https://github.com/agentfirstkit/agent-first-pay"
readme = "README.md"
keywords = ["cryptocurrency", "micropayment", "cashu", "lightning", "bitcoin"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[features]
default = [
    "redb",
    "postgres",
    "interactive",
    "cashu",
    "ln-phoenixd",
    "sol",
    "evm",
    "btc-esplora",
    "exchange-rate",
    "rpc",
    "rest",
    "backup",
]
rpc = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:aes-gcm",
    "dep:hkdf",
    "dep:sha2",
    "dep:zstd",
    "dep:tonic-build",
    "dep:tonic-prost-build",
]
backup = ["dep:tar", "dep:zstd"]
ln = ["dep:lightning-invoice"]
redb = ["dep:redb", "dep:fs2", "dep:cdk-redb"]
postgres = ["dep:sqlx", "dep:cdk-postgres"]
exchange-rate = ["dep:reqwest"]
ln-nwc = ["ln", "dep:nostr-wallet-connect"]
ln-phoenixd = ["ln", "dep:reqwest"]
ln-lnbits = ["ln", "dep:reqwest"]
sol = [
    "dep:reqwest",
    "dep:solana-address",
    "dep:solana-hash",
    "dep:solana-sdk",
    "dep:solana-signature",
    "dep:solana-short-vec",
    "dep:solana-system-interface",
    "dep:bs58",
    "dep:base64",
    "dep:wincode",
    "dep:bip39",
    "dep:spl-token",
    "dep:spl-associated-token-account",
]
evm = [
    "dep:alloy",
    "dep:reqwest",
    "dep:bip39",
]
btc-esplora = [
    "dep:bdk_wallet",
    "dep:bdk_esplora",
    "dep:bip39",
    "dep:reqwest",
]
btc-core = [
    "dep:bdk_wallet",
    "dep:bdk_bitcoind_rpc",
    "dep:bip39",
]
btc-electrum = [
    "dep:bdk_wallet",
    "dep:bdk_electrum",
    "dep:bip39",
]
cashu = ["dep:cdk", "dep:bip39"]
interactive = [
    "dep:rustyline",
    "dep:qrcode",
    "dep:crossterm",
    "dep:ratatui",
    "dep:shell-words",
]
rest = ["dep:axum", "dep:tower-http"]

[[bin]]
name = "afpay"
path = "src/main.rs"

[dependencies]
# Local monorepo development uses sibling crates where needed; version keys keep
# packaging tied to the matching published crates.
agent-first-data = { version = "0.29.2", default-features = false, features = ["cli", "skill-admin", "stream-redirect", "yaml"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
redb = { version = "4", optional = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "json"], optional = true }

nostr-wallet-connect = { package = "nwc", version = "0.44", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"], optional = true }
bs58 = { version = "0.5", optional = true }
# The wincode 0.6 migration these crates were mid-way through is complete:
# solana-instruction 3.5 and solana-message 4.5 moved with the rest, so the
# graph resolves to a single wincode again. The exact `=` pins that held the
# 0.5 set together, and the matching `--exclude` flags in scripts/instance.sh,
# are gone. Two copies of wincode is what broke `Transaction: SchemaWrite` —
# if that error returns, check for a split graph before pinning anything.
solana-address = { version = "2.7", optional = true }
solana-hash = { version = "4.6", optional = true }
solana-sdk = { version = "4", optional = true }
solana-signature = { version = "3.5", optional = true }
solana-short-vec = { version = "3.3", optional = true }
solana-system-interface = { version = "3.3", features = ["wincode"], optional = true }
base64 = { version = "0.23", optional = true }
wincode = { version = "0.6", optional = true }

alloy = { version = "2.2", default-features = false, features = ["provider-http", "signers", "signer-local", "signer-mnemonic", "network", "contract", "reqwest-rustls-tls", "rpc-types"], optional = true }
bdk_wallet = { version = "3", default-features = false, features = ["std", "keys-bip39"], optional = true }
bdk_esplora = { version = "0.22", default-features = false, features = ["async-https-rustls", "tokio"], optional = true }
bdk_bitcoind_rpc = { version = "0.22", optional = true }
bdk_electrum = { version = "0.24", default-features = false, features = ["use-rustls"], optional = true }
aes-gcm = { version = "0.11", optional = true }
bip39 = { version = "2", default-features = false, optional = true }
cdk = { version = "0.17", default-features = false, features = ["wallet"], optional = true }
cdk-redb = { version = "0.17", optional = true }
cdk-postgres = { version = "0.17", optional = true }
fs2 = { version = "0.4", optional = true }
getrandom = "0.4"
blake3 = "1"
hkdf = { version = "0.13", optional = true }
hex = "0.4"
lightning-invoice = { version = "0.34", optional = true }
prost = { version = "0.14", optional = true }
rustyline = { version = "18", optional = true }
qrcode = { version = "0.14", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
sha2 = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true }
shell-words = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
toml = "1.1"
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
spl-token = { version = "9", features = ["no-entrypoint"], optional = true }
spl-associated-token-account = { version = "8", features = ["no-entrypoint"], optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

[build-dependencies]
tonic-build = { version = "0.14", optional = true }
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
result_large_err = "allow"
items_after_test_module = "allow"
doc_lazy_continuation = "allow"
